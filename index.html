<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#536b4c" />
  <meta name="description" content="OLIVA personal wellness tracker." />
  <title>OLIVA | Mediterranean Wellness</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel lets the browser read JSX directly -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="stylesheet" href="./src/styles/style.css" />
</head>
<body>
  <div id="root"></div>
    <!-- Load reusable pieces first, then the app -->
  <script type="text/babel" src="./src/utils/storage.js"></script>
  <script type="text/babel" src="./src/components/MiniProgress.jsx"></script>
  <script type="text/babel" src="./src/components/InfoCard.jsx"></script>
  <script type="text/babel" src="./src/components/StatCard.jsx"></script>
  <!-- Layout -->
  <script type="text/babel" src="./src/components/layout/Navbar.jsx"></script>
  <script type="text/babel" src="./src/components/layout/Footer.jsx"></script>
  <!-- Trackers -->
  <script type="text/babel" src="./src/components/trackers/WaterTracker.jsx"></script>
  <script type="text/babel" src="./src/components/trackers/StepsTracker.jsx"></script>
  <script type="text/babel" src="./src/components/trackers/SleepTracker.jsx"></script>
  <script type="text/babel" src="./src/components/trackers/MoodTracker.jsx"></script>
  <script type="text/babel" src="./src/components/trackers/CustomGoals.jsx"></script>
  <script type="text/babel" src="./src/components/trackers/WellnessLog.jsx"></script>
  <!-- Messages -->
  <script type="text/babel" src="./src/components/messages/WaterAlert.jsx"></script>
  <script type="text/babel" src="./src/components/messages/StepsMessage.jsx"></script>
  <script type="text/babel" src="./src/components/messages/GoalMessage.jsx"></script>
  <script type="text/babel" src="./src/pages/HomePage.jsx"></script>
  <script type="text/babel" src="./src/pages/AboutPage.jsx"></script>
  <script type="text/babel" src="./src/pages/FeaturesPage.jsx"></script>
  <script type="text/babel" src="./src/pages/DashboardPage.jsx"></script>
  <script type="text/babel" src="./src/pages/ContactPage.jsx"></script>
  <script type="text/babel" src="./src/App.jsx"></script>
</body>
</html>
